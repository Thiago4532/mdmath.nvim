name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--generate-notes` diffs against the previous tag.
          fetch-depth: 0

      - name: Check the tag matches the plugin version
        run: |
          version=$(sed -n "s/^return '\(.*\)'$/\1/p" lua/mdmath/version.lua)
          tag=${GITHUB_REF_NAME#v}
          tag=${tag%%-*}
          if [ -z "$version" ] || [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match lua/mdmath/version.lua ($version)." >&2
            exit 1
          fi
          echo "Releasing $version"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, nothing to do."
            exit 0
          fi

          # Tags like v0.3.0-rc1 are published as prereleases.
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
